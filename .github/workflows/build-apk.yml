name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 准备 SDK 组件
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 构建 Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dyrec-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
